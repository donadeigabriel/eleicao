# Salve como .github/workflows/mapa_eleicao.yml
# Na raiz do repositório: mapa_eleicao.py e malha_br.json
name: mapa-eleicao
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # não cancela a rodada em andamento (a 1ª precisa terminar para salvar o cache)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - uses: actions/cache@v4   # guarda a base do 1º turno por município entre as rodadas
        with:
          path: base_municipios.json
          key: base-1turno-6257
      - run: python mapa_eleicao.py
        env:
          OUT_FILE: site/index.html
          NO_TELEGRAM: "1"   # apague esta linha se quiser continuar recebendo no Telegram
          BASE_ELE: "6257"   # 1º turno = base do swing
          TSE_ELE: "6258"    # 2º turno (detectado no log)
          PROJ_WORKERS: "6"  # menos requisições simultâneas (evita 429 do TSE)
          # TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
